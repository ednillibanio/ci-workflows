name: Static analysis
on:
  workflow_call:
    inputs:
      scan-path:
        description: Path in the caller repository to scan
        required: false
        type: string
        default: .
      config:
        description: Semgrep configuration or ruleset
        required: false
        type: string
        default: auto
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: 1.184.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Scan caller repository
        env:
          SEMGREP_CONFIG: ${{ inputs.config }}
          SEMGREP_SCAN_PATH: ${{ inputs.scan-path }}
        run: >-
          semgrep scan
          --config "$SEMGREP_CONFIG"
          --no-error
          --json-output semgrep-results.json
          "$SEMGREP_SCAN_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          if-no-files-found: ignore

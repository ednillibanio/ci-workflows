name: Test reusable workflows
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    uses: ./.github/workflows/backend.yml
    with:
      working-directory: tests/fixtures/backend
  frontend:
    uses: ./.github/workflows/frontend.yml
    with:
      working-directory: tests/fixtures/frontend
  hygiene:
    uses: ./.github/workflows/hygiene.yml
    with:
      pre-commit-config: .pre-commit-config.yaml
  secrets:
    uses: ./.github/workflows/secrets.yml
  sast:
    uses: ./.github/workflows/sast.yml
    with:
      config: .github/test-fixtures/sast/rules.yml
      scan-path: .github/test-fixtures/sast
  sast-execution-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.184.0
      - name: Confirm scanner configuration errors fail
        run: |
          if semgrep scan --config .github/test-fixtures/sast/invalid.yml .; then
            echo "Semgrep unexpectedly accepted an invalid configuration." >&2
            exit 1
          fi
  security:
    uses: ./.github/workflows/security.yml
  dependencies:
    uses: ./.github/workflows/dependencies.yml
  sbom-backend:
    uses: ./.github/workflows/sbom-backend.yml
    with:
      working-directory: tests/fixtures/backend
  sbom-frontend:
    uses: ./.github/workflows/sbom-frontend.yml
    with:
      working-directory: tests/fixtures/frontend

name: Backend tests
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Maven wrapper and pom.xml
        required: false
        type: string
        default: backend
      java-version:
        description: Java version
        required: false
        type: string
        default: "21"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saplnext_test
          POSTGRES_USER: sapl
          POSTGRES_PASSWORD: sapl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapl -d saplnext_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: ./mvnw -B clean test
        working-directory: ${{ inputs.working-directory }}

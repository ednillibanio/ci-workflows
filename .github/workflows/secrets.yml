name: Secret scan
on:
  workflow_call:
    inputs:
      config:
        description: Optional Gitleaks configuration file in the caller repository
        required: false
        type: string
        default: .gitleaks.toml
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: ${{ inputs.config }}
